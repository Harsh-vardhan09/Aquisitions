name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: |
          if ! npm run lint; then
            echo "::error title=ESLint failed::Run 'npm run lint:fix' to auto-fix lint issues."
            exit 1
          fi

      - name: Check Prettier formatting
        if: always()
        run: |
          if ! npm run format:check; then
            echo "::error title=Prettier check failed::Run 'npm run format' to fix formatting."
            exit 1
          fi
